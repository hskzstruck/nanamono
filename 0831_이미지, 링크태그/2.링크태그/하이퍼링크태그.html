<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하이퍼링크 태그</title>
    <h1>하이퍼링크 태그</h1>
    <p>
       하이퍼링크 태그는, 태그명은 a이다
       <br>
       a 시작태그와 종료태그 사이에 들어가는 이미지나 글을 클릭했을 때, href에 지정한 위치로 이동하게 된다. 
    </p>
    <ul>
        <li>
            <a href="https://www.naver.com/" target="_blank" title="네이버로 이동하기">여기</a>를 클릭하면 네이버로 갑니다
        </li>
        <li>
            <a href="https://www.daum.net/" target="_blank" title="다음으로 이동하기">
                <img src="./images/daum.png" alt="다음 로고">
            </a>
        </li>
        <li>
            <a href="./link1.html" target="_blank" title="우엉조림">우엉조림 레시피 보기</a>
        </li>
        <li>
            <a href="#">여기</a>를 클릭했을 때, 나중에 만들 파일을 연결할 예정입니다. 나중에 연결할 시 href의 #은 지우고 경로를 입력해줍니다.
        </li>
    </ul>
</head>
