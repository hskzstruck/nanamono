<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업시간표</title>
</head>

<body>
  <table border="1" cellspacing="0" cellpadding="5" width="500">
    <caption>원격수업용 주간 수업시간표</caption>
    <tr bgcolor="gray">
      <th></th>
      <th>월</th>
      <th>화</th>
      <th>수</th>
      <th>목</th>
      <th>금</th>
    </tr>
    <tr>
      <th>1</th>
      <td>스포츠</td>
      <td>체육</td>
      <td>음악</td>
      <td>체육</td>
      <td>체육</td>
    </tr>
    <tr>
      <th>1</th>
      <td rowspan="2">국어</td>
      <td rowspan="2">수학</td>
      <td rowspan="2">영어</td>
      <td rowspan="2">국어</td>
      <td rowspan="2">수학</td>
    </tr>
    <tr>
      <th>3</th>
    </tr>
    <tr>
      <th>4</th>
      <td rowspan="2">과학</td>
      <td>도덕</td>
      <td>기술</td>
      <td rowspan="2">가정</td>
      <td>도덕</td>
    </tr>
    <tr>
      <th>5</th>
      <td rowspan="2">역사</td>
      <td rowspan="2">역사</td>
      <td>영어</td>
    </tr>
    <tr>
      <th>6</th>
      <td>미술</td>
      <td>역사</td>
      <td>정보</td>
    </tr>
    <tr>
      <th>7</th>
      <td>-</td>
      <td>창체</td>
      <td>-</td>
      <td>미술</td>
      <td>창체(자율)</td>
    </tr>
  </table>
</body>

</html>
