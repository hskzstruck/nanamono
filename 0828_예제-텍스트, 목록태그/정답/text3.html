<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>국어사전</title>
</head>

<body>
	<h1>아름다운 순 우리말 사전</h1>
	<p>
		순 우리말로 된 아름다운 국어를 알아보고 제대로 사용해 봅시다!
	</p>
	<dl>
		<dt><b>달보드레</b></dt>
		<dd>달달하고 부드럽다</dd>
	</dl>
	<dl>
		<dt><b>안다미로</b></dt>
		<dd>담은 것이 그릇에 넘치도록 많이</dd>
	</dl>
	<dl>
		<dt><b>아름드리</b></dt>
		<dd>한 아름이 넘는 큰 나무나 물건</dd>
	</dl>
	<dl>
		<dt><b>개밥바라기</b></dt>
		<dd>저녁 무렵 서쪽 하늘에 보이는 금성</dd>
	</dl>
	<dl>
		<dt><b>별밭</b></dt>
		<dd>별이 총총히 뜬 모양을 밭에 비유한 말</dd>
	</dl>
	<dl>
		<dt><b>뽀로로</b></dt>
		<dd>종종걸음으로 재게 움직이는 모양</dd>
	</dl>
	<dl>
		<dt><b>까미</b></dt>
		<dd>얼굴이나 털빛이 까만 사람이나 동물</dd>
	</dl>
	<dl>
		<dt><b>낫낫하다</b></dt>
		<dd>상냥하고 친절하다</dd>
	</dl>
	<dl>
		<dt><b>여우비</b></dt>
		<dd>볕이 나 있는 날 잠깐 오다가 그치는 비</dd>
	</dl>
	<dl>
		<dt><b>꽃비</b></dt>
		<dd>비가 꽃잎처럼 가볍게 흩뿌리듯이 내리는 것</dd>
	</dl>
</body>

</html>
