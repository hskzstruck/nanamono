<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>sticky 실전 예제</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            color: #222;
        }

        /* 헤더 */

        #header {
            padding: 20px 0;
            background: white;
            font-size: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        header ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        /* 메인 배너 */

        .main-visual {
            height: 500px;
            background-color: blueviolet;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 50px;
            font-weight: bold;
        }

        /* 컨텐츠 영역 */

        .container {
            width: 1200px;
            margin: 100px auto;

            display: flex;
            justify-content: space-between;
        }

        /* 왼쪽 메뉴 */

        .side-menu {
            position: sticky;
            top:20px;
            width: 250px;
            align-self: flex-start;
        }

        .side-menu ul {
            list-style: none;
            border: 1px solid #ddd;
        }

        .side-menu li {
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .side-menu li:last-child {
            border-bottom: none;
        }

        /* 오른쪽 내용 */

        .content {
            width: 900px;
        }

        .content :last-child {
            margin-bottom: 0;
        }

        .box {
            height: 500px;
            background: #f5f5f5;
            margin-bottom: 40px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
            font-weight: bold;
        }

        #section2 {
            height: 1000px;
            background: salmon;
        }
    </style>
</head>

<body>

    <header id="header">
        header
    </header>

    <div class="main-visual">
        MAIN VISUAL
    </div>

    <div class="container">

        <aside class="side-menu">
            <ul>
                <li>회사소개</li>
                <li>서비스</li>
                <li>포트폴리오</li>
                <li>문의하기</li>
            </ul>
        </aside>

        <div class="content">

            <div class="box">CONTENT 1</div>
            <div class="box">CONTENT 2</div>
            <div class="box">CONTENT 3</div>

        </div>

    </div>
    <section id="section2"></section>

</body>

</html>
