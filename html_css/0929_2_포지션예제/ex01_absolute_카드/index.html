<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예제 02 — 카드 이미지 위 할인 배지</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    img {
      display: block;
    }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      background: #fff;
    }

    .inner {
      width: 1320px;
      margin: 0 auto;
    }

    /* 상품 섹션 */
    .product_section {
      padding: 80px 0 100px;
    }

    .section_top {
      text-align: center;
      margin-bottom: 48px;
    }

    .section_title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #111;
      margin-bottom: 12px;
    }

    .section_desc {
      font-size: 14px;
      color: #999;
    }

    /* 상품 리스트 */
    .product_list {
      display: flex;
      gap: 24px;
    }

    /* 상품 카드 */
    .product_card {
      flex: 1;
      cursor: pointer;
    }

    .card_img {
      background-color: #e53935;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .card_img img {
      transition: transform 0.4s ease;
    }

    .product_card:hover .card_img img {
      transform: scale(1.04);
    }

    /* 할인 배지 */
    .badge {
      position: absolute;
      top:10px;
      left:10px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .badge.sale {
      background: #e53935;
      color: #fff;
    }

    .badge.new {
      background: #111;
      color: #fff;
      font-size: 12px;
    }

    .badge.best {
      background: #f5a623;
      color: #fff;
      font-size: 12px;
    }

    /* 카드 정보 */
    .brand {
      font-size: 11px;
      font-weight: 700;
      color: #bbb;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .product_name {
      font-size: 15px;
      color: #111;
      margin-bottom: 10px;
    }

    .price_wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price_original {
      font-size: 13px;
      color: #bbb;
      text-decoration: line-through;
    }

    .price_sale {
      font-size: 16px;
      font-weight: 700;
      color: #111;
    }

    .card_img{
      position: relative;
    }
    
  </style>
</head>

<body>

  <section class="product_section">
    <div class="inner">

      <div class="section_top">
        <h2 class="section_title">BEST ITEMS</h2>
        <p class="section_desc">지금 가장 인기있는 상품을 만나보세요</p>
      </div>

      <ul class="product_list">

        <li class="product_card">
          <div class="card_img">
            <img src="./images/photo1.jpg" alt="상품1">
            <span class="badge sale">SALE<br>30%</span>
          </div>
          <p class="brand">NUEF</p>
          <p class="product_name">오버핏 크롭 자켓</p>
          <div class="price_wrap">
            <span class="price_original">89,000원</span>
            <span class="price_sale">62,300원</span>
          </div>
        </li>

        <li class="product_card">
          <div class="card_img">
            <img src="./images/photo2.jpg" alt="상품2">
            <span class="badge new">NEW</span>
          </div>
          <p class="brand">NUEF</p>
          <p class="product_name">와이드 슬랙스 팬츠</p>
          <div class="price_wrap">
            <span class="price_sale">54,000원</span>
          </div>
        </li>

        <li class="product_card">
          <div class="card_img">
            <img src="./images/photo3.jpg" alt="상품3">
            <span class="badge sale">SALE<br>20%</span>
          </div>
          <p class="brand">NUEF</p>
          <p class="product_name">린넨 블렌드 셔츠</p>
          <div class="price_wrap">
            <span class="price_original">48,000원</span>
            <span class="price_sale">38,400원</span>
          </div>
        </li>

        <li class="product_card">
          <div class="card_img">
            <img src="./images/photo4.jpg" alt="상품4">
            <span class="badge best">BEST</span>
          </div>
          <p class="brand">NUEF</p>
          <p class="product_name">플리츠 미디 스커트</p>
          <div class="price_wrap">
            <span class="price_sale">67,000원</span>
          </div>
        </li>

      </ul><!-- /product_list -->

    </div><!-- /inner -->
  </section>

</body>

</html>
