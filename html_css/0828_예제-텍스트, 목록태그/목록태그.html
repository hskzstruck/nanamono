<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록태그란?</title>
</head>
<body>
    <h1>목록태그란?</h1>
    <h2>ul과 li - 비순서형 목록</h2>
    <ul><!--이곳에 글자가 바로 들어가면 안됩니다! 그리고 li외의 태그가 바로 들어가지 않습니다-->
        <li>pli태그입니다</li>
        <li>li태그입니다</li>
        <li>li태그입니다</li>
        <li>li태그입니다</li>
        <li>li태그입니다</li>
    </ul>
    <h2>ol 과 li - 순서형 목록</h2>
    <ol type="I" reversed start="100">
        <li>li태그입니다</li>
        <li>li태그입니다</li>
        <li>li태그입니다</li>
        <li>li태그입니다</li>
        <li>li태그입니다</li>
    </ol>
    <h2>dl과 dt, dd - 정의형 목록</h2>
    <dl>
        <dt>정의형 목록 제목태그</dt>
        <dd>정의형 목록 내용 태그<br>입니다</dd>
    </dl>
</body>
</html>
