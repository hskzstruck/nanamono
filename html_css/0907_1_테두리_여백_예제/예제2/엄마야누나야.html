<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엄마야누나야</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        } /*여백 초기화 코드*/
        body{
            font-family: '맑은 고딕'; font-size: 16px; line-height: 26px; color: #121212;
            background-color: #ccc;
        }
        .white_box{
            background-color: #fff;
            width:500px;
            margin: 50px auto;
            padding: 50px;
            border:2px solid hotpink;
        }
        p {
            margin-top: 20px;
        }
        h1 {
            background: #121212; padding: 50px; color: white;
        }

    </style>
</head>
<body>
    <div class="white_box">
        <h1>엄마야 누나야</h1>
        <p>엄마야 누나야 강변 살자.<br>
            들에는 반짝이는 금모래빛<br>
            뒤문 밖에는 갈잎의 노래<br>
            엄마야 누나야 강변 살자.<br>
            <span style="color: blue; font-weight: bold;"> 시집 "진달래꽃"(1925) - 김소월<br></span>
        </p>

    </div>
</body>
</html>
