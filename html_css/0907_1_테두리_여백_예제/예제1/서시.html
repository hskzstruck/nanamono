<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서시</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            /*이 html의 기본 글씨 스타일*/
            font-family: "맑은고딕";
            font-size: 16px;
            color: #000;
            line-height: 26px;
            background-color: #ccc;
        }
        .white_box{
            background-color: #fff;
            width: 500px;
            margin: 50px auto;
            padding: 30px;
        }
        h1{
            background-color: yellowgreen;
            color: green;
            padding: 20px;
        }
        p{
            padding-top: 30px;
        }
        .orange{
            color: orange;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="white_box">
        <h1>서시</h1>
        <p>
            죽는 날까지 하늘을 우러러<br>
            한 점 부끄럼이 없기를,<br>
            잎새에 이는 바람에도<br>
            별을 노래하는 마음으로<br>
            모든 죽어 가는 것을 사랑해야지.<br>
            그리고 나한테 주어진 길을<br>
            걸어가야겠다.<br>
            오늘 밤에도 별이 바람에 스치운다.<br>
            <span class="orange">하늘과 바람과 별과 시(1948) - 윤동주</span>
        </p>
    </div>
</body>
</html>
