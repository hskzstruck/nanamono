<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하여가,단심가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "나눔고딕";
      font-size: 14px;
      line-height: 24px;
      color: #000;
    }

    div {
      border: 5px solid orange;
      width: 500px;
      margin: 50px auto;
      padding: 50px;
    }

    h1 {
      background-color: orange;
      color: #fff;
      border-top: 5px solid brown;
      padding: 20px;
    }

    .name {
      padding: 20px 0;
    }

    .chung {
      background-color: greenyellow;
      color: #fff;
    }

    .name2 {
      color: greenyellow;
      font-style: italic;
    }

    .padding {
      padding-bottom: 20px;
    }
  </style>
</head>

<body>
  <div>
    <h1>하여가</h1>
    <p class="name">
      <span class="chung">청구영언</span>
      <span class="name2">이방원</span>
    </p>
    <p class="padding">
      이런들 어떠하며 저런들 어떠하리<br>
      만수산 드렁칡이 얽혀진들 어떠하리<br>
      우리도 이같이 얽혀져 백년까지 누리리라.
    </p>
    <h1>단심가</h1>
    <p class="name">
      <span class="chung">청구영언</span>
      <span class="name2">정몽주</span>
    </p>
    <p>
      이 몸이 죽고 죽어 일백번 고쳐 죽어<br>
      백골이 진토되어 넋이라도 있고 없고<br>
      임 향한 일편단심이야 가실 줄이 있으랴.
    </p>
  </div>
</body>

</html>
