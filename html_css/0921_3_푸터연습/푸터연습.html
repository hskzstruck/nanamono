<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>푸터</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul,ol{
            list-style: none;
        }
        a{
            text-decoration: none;
            color: inherit;
        }
        body{
            font-size: 16px;
            font-family: "맑은 고딕";
            line-height: 1.2;
            color: #111;
        }
        #footer{
            background-color: #333;
            color: #aaa;
        }
        .inner{
            width: 1000px;
            margin: 0 auto;
            padding: 30px 0;
        }
        .inner nav ul{
            display: flex;
        }
        .inner nav ul li{
            padding-right: 10px;
        }
        .inner p{
            padding-top: 30px;
        }
    </style>
</head>
<body>
    <footer id="footer"><!--배경색-->
        <div class="inner"><!--가운데 정렬-->
            <nav>
                <ul>
                    <li><a href="#">푸터메뉴1</a></li>
                    <li><a href="#">푸터메뉴2</a></li>
                    <li><a href="#">푸터메뉴3</a></li>
                    <li><a href="#">푸터메뉴4</a></li>
                </ul>
            </nav>
            <p>
                나래디자인학원입니다.
            </p>
        </div>
    </footer>
</body>
</html>
