<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연두</title>
    <!--파비콘(타이틀 옆에 들어가는 아이콘) > link글씨 입력후 바로 엔터 치지 않고 자동완성 link:favicon을 선택하고 href를 내가 원하는 파비콘 이미지 경로로 설정한다-->
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
    <!--노토산스 웹폰트-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />
    <!--내가 수정하는 css가 css들 중에는 가장 마지막에 오게 해주세요!-->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header id="header"><!--보더바텀-->
        <div class="inner"><!--가운데정렬, 로고와 nav의 플렉스컨테이너-->
            <a href="#" class="logo">
                <!--플렉스아이템-->
                <img src="./images/logo.png" alt="연두로고">
            </a>
            <nav id="gnb"><!--플렉스아이템-->
                <ul><!--플렉스컨테이너(메뉴가 세로정렬에서 가로정렬이 되게)-->
                    <li><!--li들이 플렉스아이템-->
                        <a href="#">연두 스토리</a>
                    </li>
                    <li><a href="#">글로벌 연두</a></li>
                    <li><a href="#">우리맛 레시피</a></li>
                    <li><a href="#">연두 소개</a></li>
                    <li><a href="#">연두는 지금</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="main_banner">
            <!-- Swiper -->
            <div class="swiper mb">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="./images/mb1.jpg" alt="연두배너이미지1"></div>
                    <div class="swiper-slide"><img src="./images/mb2.jpg" alt="연두배너이미지2"></div>
                </div>
                <div class="swiper-button-next mb_next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

    </main>
    <footer></footer>



    
<!-- Swiper JS -->
            <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

            <!-- Initialize Swiper -->
            <script>
                var swiper = new Swiper('.mb', {
                    spaceBetween: 30,
                    centeredSlides: true,
                    autoplay: {
                        delay: 3000,
                        disableOnInteraction: false,
                    },
                    pagination: {
                        el: '.swiper-pagination',
                        clickable: true,
                    },
                    navigation: {
                        nextEl: '.swiper-button-next',
                        prevEl: '.swiper-button-prev',
                    },
                });
            </script>
</body>

</html>
