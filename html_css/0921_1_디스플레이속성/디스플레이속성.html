<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>inline&amp;block요소 예제</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    th,
    td,
    table {
      border: 1px solid #000;
      border-collapse: collapse;
    }
  
  </style>
</head>

<body>
  <h2>block 요소들</h2>
  <div>div태그입니다.</div>
  <p>p태그입니다.</p>
  <hr>
  </hr>
  <ul>
    <li>ul태그입니다.</li>
    <li>ul태그입니다.</li>
  </ul>
  <ol>
    <li>ol태그입니다.</li>
    <li>ol태그입니다.</li>
  </ol>
  <dl>
    <dt>dl태그입니다.</dt>
    <dd>ol태그입니다.</dd>
  </dl>
  <table>
    <tr>
      <th>테이블입니다.</th>
      <th>테이블입니다.</th>
    </tr>
    <tr>
      <td>테이블입니다.</td>
      <td>테이블입니다.</td>
    </tr>
  </table>
  <h1>hn 태그의 대표 h1입니다.</h1>
  <br><br><br>
  <h2>inline 요소들</h2>
  <img src="img_store.jpg" alt="예제사진">
  <span>span태그입니다.</span>
  <b>b태그입니다.</b>
  <i>i태그입니다.</i>
  <em>em태그입니다.</em>
  <a href="#">a태그입니다.</a>
  <strong>strong태그입니다.</strong>
  <video>
    <source src="movie.mp4">
  </video>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/Gm4tfdCgzCU" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>
  <label>라벨태그입니다.</label>
  <small>small 태그입니다.</small>
</body>

</html>
