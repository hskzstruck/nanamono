<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오셜록</title>
    <!-- 파비콘 -->
     <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
     <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header id="header">
        <div class="inner"><!--가운데 정렬박스는  max-width활용-->
            <a href="#" class="logo">
                <img src="./images/logo.png" alt="오셜록 로고">
            </a>
            <nav id="gnb">
                <ul>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">SHOP</a></li>
                    <li><a href="#">EVENT</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="main_banner">
            <img src="./images/main1.jpg" alt="오셜록메인배너">
        </section>
        <section id="about"><!--가운데 정렬, 그리드 컨테이너-->
            <div class="about_text"><!--그리드아이템-->
                <p class="sub_title">자연으로 가꾸다</p>
                <h2 class="title">천혜의 자연과<br>사람의 정성으로 만든 명차</h2>
                <p>오설록은 생산에서 재배, 그리고 판매까지 한 곳에서 이루어지는 세계적으로도 손꼽히는 최대 규모의 국산 차 브랜드입니다. 오셜록은 제주라는 천혜의 자연 안에서 오설록의 자연과의 상생을 통한 따뜻한 과학영농을 통해 최상의 찻잎을 얻기 위해 노력하고 있습니다.<br>이는 전통적인 방식으로 토대로 현대의 기술을 더해 최상의 차를 만들어 가는것, 즉 전통을 유지하되 시대의 흐름을 받아들이는 오설록의 자세입니다</p>
            </div>
            <div class="about_video"><!--그리드아이템-->
                <video src="./video/tea.mp4" autoplay muted loop playsinline></video>
            </div>
        </section>
        <section id="shop">
            <h2 class="sec_title">shop</h2>
            <div class="grid_container">
                <figure><img src="./images/menu1.png" alt="메뉴1"></figure>
                <figure><img src="./images/menu2.png" alt="메뉴2"></figure>
                <figure><img src="./images/menu3.png" alt="메뉴3"></figure>
                <figure><img src="./images/menu4.png" alt="메뉴4"></figure>
                <figure><img src="./images/menu5.png" alt="메뉴5"></figure>
                <figure><img src="./images/menu6.png" alt="메뉴6"></figure>
                <figure><img src="./images/menu7.png" alt="메뉴7"></figure>
                <figure><img src="./images/menu8.png" alt="메뉴8"></figure>
            </div>
        </section>
        <section id="event">
            <h2 class="sec_title">event</h2>
            <a href="#"><img src="./images/event.jpg" alt="이벤트이미지"></a>
        </section>
    </main>
    <footer id="footer">
        <a href="#"><img src="./images/f_logo.png" alt="푸터로고"></a>
    </footer>
</body>
</html>
