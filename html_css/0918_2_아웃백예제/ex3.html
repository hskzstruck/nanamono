<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아웃백</title>

    <link rel="stylesheet" href="./css/outback.css">
</head>
<body>
    <section id="tomahawk_steak"><!--배경이미지(스테이크)-->
        <div class="container"><!--가운데정렬, 플렉스컨테이너-->
            <div class="black_box"><!--실제로 움직이는 레이아웃 박스. 플렉스아이템(width500)-->
                <div class="text">
                    <p class="sub_title">토마호크 스테이크</p>
                    <h2>TOMAHAWK STEAK</h2>
                    <p>오직 황제만이 즐길 수 있었던 블랙 앵거스의 단 1%의 부위 3cm 이상의 두께에서 뿜어져 나오는 압도적인 풍미가 가득한 예술적 스테이크</p>
                    <p class="origin">소고기(블랙앵거스/립아이) : 미국산</p>
                    <p class="price">100g 당 <span>18,000원</span></p>
                    <a href="#" class="card_btn">부메랑 카드를 등록해 주세요.</a>
                </div><!--text-->
                <div class="button">
                    <a href="#" class="btn1">
                        <img src="./images/icon_store.png" alt="매장찾기아이콘이미지">
                        <br>매장찾기
                    </a>
                    <a href="#" class="btn2">
                        <img src="./images/icon_reservation.png" alt="네이버예약아이콘이미지">
                        <br>네이버 예약
                    </a>
                </div><!--button-->
            </div><!--black_box-->
        </div><!--container-->
    </section>
</body>
</html>
