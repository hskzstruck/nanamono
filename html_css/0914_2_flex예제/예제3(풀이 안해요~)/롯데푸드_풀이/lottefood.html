<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<title>롯데푸드</title>

	<style>
		* {
			margin: 0;
			padding: 0;
		}

		body {
			font-family: "나눔바른고딕";
			font-size: 12px;
			line-height: 22px;
			color: #000;
		}



		.contents {
			margin: 80px auto;
			width: 750px;
			background: url(images/bg_meat.gif) no-repeat right top;
		}

		h1 {
			font-size: 40px;
			padding-bottom: 30px;
		}

		h4 {
			color: #999;
			padding-bottom: 40px;
		}

		h3 {
			font-size: 20px;
			color: #ff1a1a;
			padding-bottom: 50px;
		}

		.red {
			background: #ff1a1a;
			width: 250px;
			height: 260px;
			padding: 30px;
			box-sizing: border-box;
		}

		.meat {
			width: 500px;
		}

		.text {
			background: #eee;
			padding: 30px;
			margin-top: 30px 0;
		}

		h5 {
			font-size: 20px;
			font-weight: 400;
			padding-bottom: 30px;
		}

		.box {
			margin-top: 20px;
		}

		.flex_box {
			display: flex;
		}
	</style>
</head>

<body>
	<div class="contents">
		<h1>육가공사업</h1>
		<h4>롯데푸드는 국내 식품산업의 역사입니다.</h4>
		<h3>믿을 수 있는 기업, 롯데푸드의<br>
			대표 사업영역을 확인할 수 있습니다.</h3>
		<div class="flex_box">
			<div class="red">
				<img src="images/intro_meat.png" alt="육가공사업 소개">
			</div><!--red-->
			<div class="meat">
				<img src="images/meat.jpg" alt="소세지 사진">
			</div><!--meat-->
		</div><!--flex_box-->
	</div><!--contents-->
</body>

</html>
