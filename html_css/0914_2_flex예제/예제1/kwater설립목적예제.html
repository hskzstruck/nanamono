<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kwater설립목적</title>
</head>
<style>
    *{
        margin:0;
        padding:0;
    }
    body{
        font-family: "맑은 고딕";
        font-size: 14px;
        line-height: 1.2;
        color:#111;
    }
    .main{
        background-color: lightgray;
        width: 800px;
        margin: 0 auto;
        padding:50px;
    }
    h1{
        color:blue;
        padding: 20px;
    }
    .desc{
        background-color: lightskyblue;
        padding: 20px;
        color:white;
        margin:10px;
    }
    .container{
        display:flex;
        gap:20px;
        width: 700px;
    }
    .imgbox{
        width: 400px;
        padding:20px;
    }
    .subtitle{
        font-size: 20px;
        font-weight: bold;
    }
    .list{
        padding:20;
        margin: 20px 0;
        line-height: 25px;
    }
</style>
<body>
    <div class="main">
        <h1>설립목적</h1>
        <p class="desc">K water는 수자원을 종합적으로 개발, 관리하여 생활용수 등의 공급을 원활하게 하고 수질을 개선함으로서 국민 생활의 향상과 공공복리의 증진에 이바지함을 목적으로 하는 공기업입니다.</p>
        <div class="container">
            <div class="imgbox">
                <img src="./images/kwater.jpg" alt="설립목적">
            </div>
            <div class="textbox">
                <p class="subtitle">임무와 역할</p>
                    <ul class="list">
                        <li>수자원의 종합적인 이용, 개발을 위한 시설의 건설 운영관리</li>
                        <li>광역상수도(공업용수도 포함) 시설의 건설 관리</li>
                        <li>산업단지 및 특수지역 개발</li>
                        <li>지방상 하수도 수탁 운영</li>
                        <li>신재생에너지 설비의 설치 운영관리 등</li>
                    </ul>
            </div>
        </div>
    </div>
</body>
</html>
