<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개발산업</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            font-family: "맑은 고딕";
            font-size: 12px;
            line-height: 22px;
            color: #fff;
        }
        .container{
            width: 900px;
            margin: 100px auto;
            display: grid;
            grid-template-columns: 500px 1fr;
        }
        .text_box{
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="container"><!--가운데정렬, 그리드컨테이너-->
        <div class="img_box">
            <img src="./images/img_develop.jpg" alt="이미지">
        </div><!--img_box-->
        <div class="text_box">
            <h1>개발사업</h1>
            <p class="english">Total Solution Provider</p>
            <p>꿈이 실현되는 공간을 창조</p>
            <p>개발사업은 상상했던 세계를 현실로 이루어 내는 사업분야입니다. 최고의 전문인력과 경험을 바탕으로 꿈이 실현되는 공간을 창조해 나가겠습니다.</p>
            <p>송도복합개발(6,8공구)</p>
            <p>국제비즈니스 중심도시로 거듭나는 송도에 친환경 미래도시를 테마로 한 대규모 주거중심 개발사업</p>
            <p>※ 프로젝트 문의 : 이혜민 대리</p>
        </div><!--text_box-->
    </div><!--container-->
</body>
</html>
