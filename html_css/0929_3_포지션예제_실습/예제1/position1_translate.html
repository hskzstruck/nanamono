<!doctype html>
<html>

<head>
	<title>position_hover연습</title>
	<style>
		* {
			margin: 0;
			padding: 0
		}

		div {
			width: 1200px;
			margin: auto;
		}

		ul {
			list-style: none;
			padding: 100px 0;
		}

		ul li {
			float: left;
			transition: all 0.5s
		}

		ul li:nth-child(2) {
			margin: 0 30px;
		}

		ul li:hover {
			transform: translateY(-10px)
		}

		ul li img {
			display: block;
		}

		li{
			position:relative;
		}
		.card_box .best{
			position:absolute;
			top:20px;
			left:20px;
		}
	</style>
</head>

<body>
	<div>
		<ul>
			<li class="card_box">
				<img src="images/p1.jpg" alt="이미지1">
				<img src="images/best1.png" alt="best1" class="best">
			</li>
			<li class="card_box">
				<img src="images/p2.jpg" alt="이미지1">
				<img src="images/best2.png" alt="best1" class="best">
			</li>
			<li class="card_box">
				<img src="images/p3.jpg" alt="이미지1">
				<img src="images/best3.png" alt="best1" class="best">
			</li>
		</ul>
	</div>
</body>

</html>
