<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회사개요</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "맑은 고딕";
      font-size: 12px;
      line-height: 22px;
      color: #000;
    }

    .wrap {
      width: 600px;
      margin: 50px auto;
    }

    h1 {
      border-bottom: 1px solid #000;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    th,
    td {
      border-bottom: 1px solid #999;
      padding: 10px 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      border-top: 3px solid green;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    th {
      background-color: #ccc;
    }

    span {
      color: green;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!--가운데정렬, width:600-->
    <h1>회사개요</h1>
    <img src="images/company.gif" alt="회사사진">
    <table>
      <tr>
        <th>기업명</th>
        <td>(주)녹십자</td>
      </tr>
      <tr>
        <th>설립일</th>
        <td>1967년 10월 5일</td>
      </tr>
      <tr>
        <th>상장일</th>
        <td>1978년 8월 28일</td>
      </tr>
      <tr>
        <th>대표이사</th>
        <td>허일섭 회장, 조순태 사장, 이병건 사장</td>
      </tr>
      <tr>
        <th>대표업종</th>
        <td>의약품 제조 및 판매 등</td>
      </tr>
    </table>
    <p>
      지난 반세기 동안 국내 생명공학산업을 선도해 왔던 녹십자가 이제 인류 모두의 행복한 내일을 위한 <span>‘건강산업의 글로벌 리더’</span>로 새롭게 거듭나고 있습니다. 이를 위해 녹십자는 창의와
      도전의 정신을 바탕으로
      녹색의 십자가
      의미하는 <span>봉사와 배려, 정도와 정의</span>를 지키고 <span>인간을 존중</span>할 것을 약속합니다.
    </p>
  </div>
  <!--wrap E-->
</body>

</html>
